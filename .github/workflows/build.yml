name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Proje klasörünü bul
        id: find
        run: |
          for z in $(find . -maxdepth 2 -iname "*.zip"); do
            echo "Zip bulundu, açılıyor: $z"
            unzip -o -q "$z" -d "$(dirname "$z")"
          done

          DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" \
                | grep -v "/build/" | head -n 1 | xargs -r dirname)

          if [ -z "$DIR" ]; then
            echo "::error::settings.gradle.kts bulunamadi. Repo icerigi:"
            find . -maxdepth 3 -not -path "./.git/*"
            exit 1
          fi

          echo "Proje klasoru: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KolayDosyaGonderim-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
